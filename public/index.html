<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quem vota em quem · Eleições 2026</title>
  <meta name="description" content="Quem vota em um candidato também vota em outro? As eleições de 2026 seção por seção, no Brasil inteiro: escolha dois candidatos (ou um candidato e a esquerda ou a direita) e veja onde os votos coincidem.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0f0e0d">
  <meta property="og:title" content="Quem vota em quem · Eleições 2026">
  <meta property="og:description" content="Quem vota em X também vota em Y? Seção por seção, no Brasil inteiro.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f0e0d'/%3E%3Ccircle cx='12.5' cy='16' r='7.5' fill='%23e7c94a' fill-opacity='.9'/%3E%3Ccircle cx='19.5' cy='16' r='7.5' fill='%236f9fd8' fill-opacity='.8'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/faustina-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="data/br.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <script src="vendor/maplibre-gl.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">
    <div id="map" role="region" aria-label="Mapa"></div>

    <header class="top">
      <a class="brand" href="#" id="brand" aria-label="Quem vota em quem: início">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12.5" cy="16" r="7.5" fill="#e7c94a" fill-opacity=".9"/><circle cx="19.5" cy="16" r="7.5" fill="#6f9fd8" fill-opacity=".8"/></svg>
        <span class="brand-t">Quem vota em quem</span><span class="brand-s">2026</span>
      </a>
      <button class="pill uf-pill" id="uf-pill" type="button" aria-haspopup="dialog">Brasil</button>
      <button class="search-btn" id="search-btn" type="button" aria-haspopup="dialog">
        <span class="sb-i" id="sb-i"></span><span class="sb-t">Buscar candidato ou lugar</span><kbd>/</kbd>
      </button>
      <div class="top-r">
        <button class="pill icon-btn" id="btn-share" type="button" title="Copiar o link desta visão">Copiar link</button>
      </div>
    </header>

    <!-- no celular, .sheet vira a gaveta de baixo com os dois cartões; no desktop ela "some" (display: contents) -->
    <div class="sheet" id="sheet" data-snap="half">
      <button class="sheet-handle" id="sheet-handle" type="button" aria-label="Expandir ou recolher"></button>
      <section class="card card-main" id="main-card" aria-live="polite"></section>
      <section class="card card-side" id="side-card"></section>
    </div>

    <div class="mapbar" id="mapbar" hidden></div>
    <nav class="crumbs" id="crumbs" aria-label="Recorte"></nav>
    <div class="legend" id="legend" hidden></div>
    <div class="tip" id="tip" hidden role="tooltip"></div>
    <div class="toast" id="toast" hidden role="status"></div>

    <div class="loading" id="loading" role="status">
      <svg class="logo pulse" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12.5" cy="16" r="7.5" fill="#e7c94a" fill-opacity=".9"/><circle cx="19.5" cy="16" r="7.5" fill="#6f9fd8" fill-opacity=".8"/></svg>
      <div id="loading-t">Carregando…</div>
    </div>
  </div>
</body>
</html>
