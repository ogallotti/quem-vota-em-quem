name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # núcleo estatístico: não publica se a matemática quebrar
      - run: node --test tests/*.test.mjs

  deploy:
    needs: testes
    # só publica depois que o projeto Pages e os secrets existirem (variável do repositório PAGES_ATIVO = true)
    if: ${{ vars.PAGES_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar public/ no Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm # o runner não tem pnpm; o wrangler instala via npm
          command: pages deploy public --project-name=quem-vota-em-quem --branch=main
